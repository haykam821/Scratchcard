name: Build
on:
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
        env:
          GITHUB_REPOSITORY: "${GITHUB_REPOSITORY}"
      - name: Upload
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4.0.5