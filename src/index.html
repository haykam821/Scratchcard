<!DOCTYPE html>

<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Scratchcard</title>

		<script type="module" src="index.js"></script>
		<link rel="stylesheet" href="index.css">
	</head>

	<body>
		<header>
			<h1>
				Scratchcard
			</h1>
		</header>

		<main>
			<div id="card">
				<div id="wrapper">
					<canvas id="layer"></canvas>
					<div id="contents">
						<span id="text"></span>
					</div>
				</div>
				<span id="label">&nbsp;</span>
			</div>

			<div id="editor" class="hidden">
				<h2>
					Create a Message
				</h2>

				<div id="inputs">
					<textarea id="input" placeholder="Hidden message"></textarea>
					<textarea id="label-input" placeholder="Label"></textarea>
				</div>

				<button id="create">
					Create
				</button>
			</div>
		</main>
	</body>
</html>
